name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Build web application
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Grant execute permission to Gradle wrapper
        run: chmod +x android/gradlew

      - name: Decode release keystore
        id: keystore
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/ajb-release.keystore
            echo "has_keystore=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_keystore=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret not set — building an UNSIGNED release APK. Every future build without a consistent signing key will require users to uninstall the previous version before installing the new one. See README section 'Android app signing' to fix this once and for all."
          fi

      # versionCode must strictly increase for Android to accept an install
      # as an "update" rather than a conflicting/older package. Using the
      # workflow run number guarantees that automatically, forever, with
      # zero manual bookkeeping.
      - name: Build release APK
        working-directory: android
        run: |
          if [ "${{ steps.keystore.outputs.has_keystore }}" = "true" ]; then
            ./gradlew assembleRelease --no-daemon \
              -PversionCode=${{ github.run_number }} \
              -PversionName="1.0.${{ github.run_number }}" \
              -PAJB_KEYSTORE_FILE="$(pwd)/app/ajb-release.keystore" \
              -PAJB_KEYSTORE_PASSWORD="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
              -PAJB_KEY_ALIAS="${{ secrets.ANDROID_KEY_ALIAS }}" \
              -PAJB_KEY_PASSWORD="${{ secrets.ANDROID_KEY_PASSWORD }}"
          else
            ./gradlew assembleRelease --no-daemon \
              -PversionCode=${{ github.run_number }} \
              -PversionName="1.0.${{ github.run_number }}"
          fi

      - name: Remove decoded keystore
        if: always()
        run: rm -f android/app/ajb-release.keystore

      - name: Verify APK exists
        run: |
          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_PATH" ]; then
            APK_PATH="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          fi
          if [ ! -f "$APK_PATH" ]; then
            echo "APK not found — build failed."
            exit 1
          fi
          echo "APK found: $APK_PATH"
          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AJB-Leaders-Academy-Grade-Management-System
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
