apply plugin: 'com.android.application'

def releaseKeystorePath = System.getenv('ANDROID_KEYSTORE_PATH') ?: project.findProperty('androidKeystorePath')
def releaseKeystorePassword = System.getenv('ANDROID_KEYSTORE_PASSWORD') ?: project.findProperty('androidKeystorePassword')
def releaseKeyAlias = System.getenv('ANDROID_KEY_ALIAS') ?: project.findProperty('androidKeyAlias')
def releaseKeyPassword = System.getenv('ANDROID_KEY_PASSWORD') ?: project.findProperty('androidKeyPassword')

def releaseSigningConfigured = releaseKeystorePath && releaseKeystorePassword && releaseKeyAlias && releaseKeyPassword

def releaseVersionCode = (
    System.getenv('ANDROID_VERSION_CODE') ?:
    project.findProperty('androidVersionCode') ?:
    project.findProperty('versionCode') ?:
    '1'
).toInteger()

def releaseVersionName = (
    System.getenv('ANDROID_VERSION_NAME') ?:
    project.findProperty('androidVersionName') ?:
    project.findProperty('versionName') ?:
    '1.0.0'
)

android {
    namespace = "com.ajbleadersacademy.grades"
    compileSdk = rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.ajbleadersacademy.grades"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion

        versionCode releaseVersionCode
        versionName releaseVersionName

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        aaptOptions {
            // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
            // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    signingConfigs {
        release {
            // Supports both environment variables and the AJB_KEYSTORE_* properties
            // passed by the GitHub Actions workflow.
            def ajbKeystoreFile = project.findProperty('AJB_KEYSTORE_FILE')
            def ajbKeystorePassword = project.findProperty('AJB_KEYSTORE_PASSWORD')
            def ajbKeyAlias = project.findProperty('AJB_KEY_ALIAS')
            def ajbKeyPassword = project.findProperty('AJB_KEY_PASSWORD')

            if (ajbKeystoreFile && ajbKeystorePassword && ajbKeyAlias && ajbKeyPassword) {
                storeFile file(ajbKeystoreFile)
                storePassword ajbKeystorePassword
                keyAlias ajbKeyAlias
                keyPassword ajbKeyPassword
            } else if (releaseSigningConfigured) {
                storeFile file(releaseKeystorePath)
                storePassword releaseKeystorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            if (releaseSigningConfigured || project.hasProperty('AJB_KEYSTORE_FILE')) {
                signingConfig signingConfigs.release
            }

            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir {
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}